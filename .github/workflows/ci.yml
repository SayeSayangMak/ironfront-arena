name: IRONFRONT QA

on:
  push:
  pull_request:

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: npm run check
      - name: Dedicated multiplayer regression tests
        run: npm test
